services:
  # 1. PHP REST API Backend (UniWiz API)
  - type: web
    name: uniwiz-backend-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: FRONTEND_URL
        sync: false

  # 2. Node.js Real-Time Socket.IO Chat Service
  - type: web
    name: uniwiz-chat-socket
    runtime: node
    buildCommand: npm install && npx prisma generate
    startCommand: node socket-server.js
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
