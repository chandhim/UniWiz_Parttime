<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" role="img" aria-labelledby="t d">
  <title id="t">Student finding a part-time job on UniWiz</title>
  <desc id="d">A student with a laptop surrounded by job cards, a verified badge and a payment notification.</desc>
  <defs>
    <linearGradient id="blob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d1fae5"/>
      <stop offset="1" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="1" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Background shapes -->
  <path d="M96 120c36-70 150-96 248-72 104 26 170 110 152 214-16 94-96 170-206 178C176 448 70 390 50 292c-10-60 4-124 46-172z" fill="url(#blob)"/>
  <circle cx="470" cy="86" r="26" fill="url(#gold)" opacity="0.9"/>
  <circle cx="64" cy="402" r="14" fill="#10b981" opacity="0.6"/>
  <g fill="none" stroke="#10b981" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round">
    <path d="M30 80h36M48 62v36"/>
    <path d="M500 400h28M514 386v28"/>
  </g>

  <!-- Desk -->
  <rect x="86" y="396" width="388" height="14" rx="7" fill="#065f46"/>
  <rect x="120" y="410" width="10" height="56" rx="4" fill="#064e3b"/>
  <rect x="430" y="410" width="10" height="56" rx="4" fill="#064e3b"/>

  <!-- Student -->
  <g>
    <!-- torso -->
    <path d="M196 396c-6-70 10-118 62-126 52-8 82 40 78 126z" fill="url(#emerald)"/>
    <!-- arm -->
    <path d="M300 300c20 24 40 52 58 82l-26 14c-18-26-38-48-62-62z" fill="#047857"/>
    <!-- neck + head -->
    <rect x="248" y="226" width="26" height="40" rx="12" fill="#b9754b"/>
    <circle cx="262" cy="200" r="40" fill="#c98558"/>
    <!-- hair -->
    <path d="M222 198c-6-38 24-62 54-58 30 4 46 28 38 52-12-22-30-30-52-26-18 3-30 14-40 32z" fill="#1e293b"/>
    <!-- graduation cap -->
    <path d="M214 156l52-24 52 24-52 24z" fill="#0f172a"/>
    <path d="M238 172v22c0 8 56 8 56 0v-22l-28 12z" fill="#1e293b"/>
    <path d="M318 156v34" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <circle cx="318" cy="194" r="5" fill="#fbbf24"/>
    <!-- smile -->
    <path d="M250 212c6 7 18 7 24 0" fill="none" stroke="#7c3f1d" stroke-width="3" stroke-linecap="round"/>
    <circle cx="246" cy="200" r="3" fill="#1e293b"/>
    <circle cx="278" cy="200" r="3" fill="#1e293b"/>
  </g>

  <!-- Laptop -->
  <g filter="url(#shadow)">
    <path d="M312 392l18-92c1-6 6-10 12-10h118c6 0 10 5 9 11l-16 91z" fill="#e2e8f0"/>
    <path d="M322 384l16-82h112l-14 82z" fill="#0f172a"/>
    <rect x="344" y="312" width="60" height="8" rx="4" fill="#10b981"/>
    <rect x="344" y="328" width="84" height="6" rx="3" fill="#334155"/>
    <rect x="344" y="342" width="70" height="6" rx="3" fill="#334155"/>
    <rect x="344" y="356" width="40" height="14" rx="7" fill="url(#gold)"/>
    <path d="M296 392h192c0 8-6 14-14 14H310c-8 0-14-6-14-14z" fill="#cbd5e1"/>
  </g>

  <!-- Floating card: job listing -->
  <g filter="url(#shadow)">
    <rect x="22" y="196" width="196" height="92" rx="18" fill="#fff"/>
    <rect x="38" y="212" width="40" height="40" rx="12" fill="#d1fae5"/>
    <path d="M50 232l8 8 12-16" fill="none" stroke="#059669" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" transform="translate(-2 -2)"/>
    <rect x="88" y="214" width="106" height="9" rx="4.5" fill="#0f172a"/>
    <rect x="88" y="232" width="74" height="7" rx="3.5" fill="#94a3b8"/>
    <rect x="38" y="262" width="62" height="16" rx="8" fill="#ecfdf5"/>
    <rect x="46" y="268" width="46" height="4" rx="2" fill="#059669"/>
    <rect x="108" y="262" width="62" height="16" rx="8" fill="#fef3c7"/>
    <rect x="116" y="268" width="46" height="4" rx="2" fill="#d97706"/>
  </g>

  <!-- Floating card: payment -->
  <g filter="url(#shadow)">
    <rect x="352" y="120" width="176" height="76" rx="18" fill="#fff"/>
    <circle cx="388" cy="158" r="20" fill="url(#gold)"/>
    <text x="388" y="165" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#fff">$</text>
    <rect x="420" y="140" width="84" height="9" rx="4.5" fill="#0f172a"/>
    <rect x="420" y="160" width="58" height="7" rx="3.5" fill="#94a3b8"/>
    <rect x="420" y="174" width="30" height="8" rx="4" fill="#10b981"/>
  </g>

  <!-- Floating badge: verified -->
  <g filter="url(#shadow)">
    <circle cx="150" cy="130" r="34" fill="#fff"/>
    <path d="M150 108l18 7v14c0 14-8 22-18 27-10-5-18-13-18-27v-14z" fill="url(#emerald)"/>
    <path d="M141 134l7 7 12-14" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Plant -->
  <g>
    <path d="M118 396c-4-26 4-50 18-62-2 28 0 48-4 62z" fill="#10b981"/>
    <path d="M118 396c-10-18-26-26-40-26 8 14 20 26 40 26z" fill="#059669"/>
    <path d="M120 396c8-14 22-20 34-18-4 12-16 20-34 18z" fill="#34d399"/>
    <path d="M96 396h40l-6 -22H102z" fill="#f59e0b" transform="translate(0 0)"/>
  </g>
</svg>
